# The whole site is one Cloudflare Worker with static assets, the same setup as dnsmailcheck (docs/dnsmailcheck-setup.md).
# Account: Stackbriefco@gmail.com's Account (login stackbriefco@gmail.com), which holds the wirecalculators.com zone.
# D1 wirecalc-db and KV wirecalc-kv created there 2026-10-31. (The first preview ran on dnsmailcheck's clutcharchive2006
# account; that Worker and D1 are left in place, untouched: docs/setup-steps.md.)
# Local: npm run db:migrate:local && npm run dev    Deploy: npx --yes wrangler deploy
name = "wirecalc-site"
account_id = "1552e47f096ee67d67374d48d09873a8" # Stackbriefco@gmail.com's Account
main = "src/worker.ts"
compatibility_date = "2026-10-01" # dnsmailcheck's date
# As dnsmailcheck: served only on the custom domain, no workers.dev subdomain. Version preview URLs stay on (dnsmailcheck
# turned them off only because its Durable Object blocks them; this site has none).
workers_dev = false
preview_urls = true

# wirecalculators.com, connected the way dnsmailcheck.com is: Workers Custom Domains for the apex and www (Cloudflare creates
# the DNS records and certificates); the Worker answers www with a 301 to the apex (src/worker.ts canonicalRedirect).
routes = [
  { pattern = "wirecalculators.com", custom_domain = true },
  { pattern = "www.wirecalculators.com", custom_domain = true },
]

# Local dev presents requests as https (as dnsmailcheck does), so the Worker's http -> https redirect never fires locally.
[dev]
upstream_protocol = "https"

# `wrangler dev` and `wrangler deploy` run this first: it writes the static site to public/.
[build]
command = "npm run build"
watch_dir = ["src", "site", "content"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"       # serves public/404.html with a 404 status
html_handling = "auto-trailing-slash" # /voltage-drop-calculator serves voltage-drop-calculator.html
run_worker_first = true # every request: www -> apex and http -> https redirects, then pages via env.ASSETS

# Workers Logs, as dnsmailcheck: our own console output only. Per-request invocation logs stay off: they'd keep request URLs
# and request metadata such as the visitor's IP, which /privacy says we never keep.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

# Daily at 07:00 UTC: the retention purge (src/lib/retention.ts), dnsmailcheck's 07:00 slot.
[triggers]
crons = ["0 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wirecalc-db"
database_id = "bd55cd2b-7b5c-4e4c-9391-063d81a3a644"
migrations_dir = "migrations"

# Bound like dnsmailcheck's KV. No ported feature writes to it yet (dnsmailcheck used KV for its DNS result cache).
[[kv_namespaces]]
binding = "KV"
id = "eecafc8a7f35443cb35bd0689fcf6e67" # title "wirecalc-kv"
